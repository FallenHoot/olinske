<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="600" fill="#ffffff"/>
  
  <!-- Desk -->
  <rect x="50" y="350" width="1100" height="200" fill="#f5f5f5" rx="8"/>
  
  <!-- Laptop base -->
  <rect x="300" y="280" width="600" height="80" fill="#2a2a2a" rx="4"/>
  
  <!-- Screen background -->
  <rect x="320" y="100" width="560" height="200" fill="#1a1a1a" rx="4" stroke="#333" stroke-width="2"/>
  
  <!-- Window 1: Claude -->
  <rect x="330" y="110" width="170" height="180" fill="#f0f0f0" stroke="#464feb" stroke-width="2" rx="3"/>
  <text x="340" y="130" font-family="system-ui" font-size="12" font-weight="bold" fill="#464feb">Claude</text>
  <line x1="330" y1="140" x2="500" y2="140" stroke="#e0e0e0" stroke-width="1"/>
  <circle cx="420" cy="160" r="25" fill="#464feb" opacity="0.1"/>
  <text x="340" y="190" font-family="monospace" font-size="9" fill="#666">Technical decisions...</text>
  
  <!-- Window 2: ChatGPT -->
  <rect x="520" y="110" width="170" height="180" fill="#f0f0f0" stroke="#464feb" stroke-width="2" rx="3"/>
  <text x="530" y="130" font-family="system-ui" font-size="12" font-weight="bold" fill="#464feb">ChatGPT</text>
  <line x1="520" y1="140" x2="690" y2="140" stroke="#e0e0e0" stroke-width="1"/>
  <circle cx="605" cy="160" r="25" fill="#464feb" opacity="0.1"/>
  <text x="530" y="190" font-family="monospace" font-size="9" fill="#666">Code & summaries...</text>
  
  <!-- Window 3: Documentation -->
  <rect x="710" y="110" width="170" height="180" fill="#f0f0f0" stroke="#464feb" stroke-width="2" rx="3"/>
  <text x="720" y="130" font-family="system-ui" font-size="12" font-weight="bold" fill="#464feb">Docs</text>
  <line x1="710" y1="140" x2="880" y2="140" stroke="#e0e0e0" stroke-width="1"/>
  <circle cx="795" cy="160" r="25" fill="#464feb" opacity="0.1"/>
  <text x="720" y="190" font-family="monospace" font-size="9" fill="#666">Documentation...</text>
  
  <!-- Hands on keyboard -->
  <ellipse cx="450" cy="320" rx="60" ry="30" fill="#d4a574" opacity="0.8"/>
  <ellipse cx="750" cy="320" rx="60" ry="30" fill="#d4a574" opacity="0.8"/>
  
  <!-- Clock -->
  <circle cx="950" cy="150" r="40" fill="none" stroke="#464feb" stroke-width="2"/>
  <line x1="950" y1="150" x2="950" y2="130" stroke="#464feb" stroke-width="2"/>
  <line x1="950" y1="150" x2="965" y2="150" stroke="#464feb" stroke-width="2"/>
  <text x="935" y="175" font-family="system-ui" font-size="14" font-weight="bold" fill="#464feb">2 PM</text>
  
  <!-- Title -->
  <text x="600" y="530" font-family="system-ui" font-size="24" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Engineering manager at 2 p.m.</text>
  <text x="600" y="560" font-family="system-ui" font-size="16" fill="#666" text-anchor="middle">Cognitive overload from juggling three AI tools simultaneously</text>
</svg>