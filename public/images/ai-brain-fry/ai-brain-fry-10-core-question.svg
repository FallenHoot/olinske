<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="600" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="500" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#1a1a1a" text-anchor="middle">The Central Question</text>
  
  <!-- Timeline items: 40 years of evidence -->
  
  <!-- 1983 -->
  <g>
    <circle cx="120" cy="250" r="45" fill="#f0f4ff" stroke="#464feb" stroke-width="2"/>
    <text x="120" y="248" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#464feb" text-anchor="middle">1983</text>
    <text x="120" y="265" font-family="system-ui, sans-serif" font-size="10" fill="#464feb" text-anchor="middle">Warning</text>
    <line x1="165" y1="250" x2="215" y2="250" stroke="#464feb" stroke-width="2"/>
    <polygon points="215,250 225,245 225,255" fill="#464feb"/>
  </g>
  
  <!-- 1996 -->
  <g>
    <circle cx="310" cy="250" r="45" fill="#f0f4ff" stroke="#464feb" stroke-width="2"/>
    <text x="310" y="248" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#464feb" text-anchor="middle">1996</text>
    <text x="310" y="265" font-family="system-ui, sans-serif" font-size="10" fill="#464feb" text-anchor="middle">Documented</text>
    <line x1="355" y1="250" x2="405" y2="250" stroke="#464feb" stroke-width="2"/>
    <polygon points="405,250 415,245 415,255" fill="#464feb"/>
  </g>
  
  <!-- 2007 -->
  <g>
    <circle cx="500" cy="250" r="45" fill="#f0f4ff" stroke="#464feb" stroke-width="2"/>
    <text x="500" y="248" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#464feb" text-anchor="middle">2007</text>
    <text x="500" y="265" font-family="system-ui, sans-serif" font-size="10" fill="#464feb" text-anchor="middle">Formalized</text>
    <line x1="545" y1="250" x2="595" y2="250" stroke="#464feb" stroke-width="2"/>
    <polygon points="595,250 605,245 605,255" fill="#464feb"/>
  </g>
  
  <!-- 2026 -->
  <g>
    <circle cx="690" cy="250" r="55" fill="#fff5f5" stroke="#d32f2f" stroke-width="3"/>
    <text x="690" y="250" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#d32f2f" text-anchor="middle">2026</text>
    <text x="690" y="268" font-family="system-ui, sans-serif" font-size="11" fill="#d32f2f" text-anchor="middle">Exceeded</text>
  </g>
  
  <!-- Question box -->
  <rect x="80" y="350" width="840" height="180" rx="8" fill="#f8f9ff" stroke="#464feb" stroke-width="2"/>
  
  <text x="500" y="390" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Is human supervisory capacity infinite?</text>
  
  <text x="500" y="435" font-family="system-ui, sans-serif" font-size="16" fill="#333" text-anchor="middle">40 years of research provides the answer:</text>
  
  <text x="500" y="475" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#d32f2f" text-anchor="middle">No. Capacity is finite.</text>
  
  <text x="500" y="515" font-family="system-ui, sans-serif" font-size="13" fill="#666" text-anchor="middle">Demand has exceeded it. The structure must change.</text>
</svg>