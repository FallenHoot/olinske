<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="500" fill="#ffffff"/>
  
  <!-- Desk surface -->
  <rect x="0" y="350" width="1000" height="150" fill="#e8e8e8"/>
  
  <!-- Monitor bezels -->
  <rect x="150" y="80" width="700" height="300" fill="#1a1a1a" rx="8" stroke="#333" stroke-width="2"/>
  
  <!-- Window 1: AI Tool 1 -->
  <rect x="170" y="100" width="200" height="260" fill="#f5f5f5" stroke="#464feb" stroke-width="2" rx="4"/>
  <rect x="170" y="100" width="200" height="30" fill="#464feb"/>
  <text x="270" y="120" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle">AI Tool 1</text>
  <line x1="170" y1="135" x2="370" y2="135" stroke="#ddd" stroke-width="1"/>
  <text x="180" y="165" font-family="system-ui, sans-serif" font-size="11" fill="#666">Technical</text>
  <text x="180" y="185" font-family="system-ui, sans-serif" font-size="11" fill="#666">Decisions</text>
  <circle cx="270" cy="220" r="20" fill="#464feb" opacity="0.15"/>
  <line x1="180" y1="250" x2="360" y2="250" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="180" y1="260" x2="340" y2="260" stroke="#e0e0e0" stroke-width="1"/>
  
  <!-- Window 2: AI Tool 2 -->
  <rect x="400" y="100" width="200" height="260" fill="#f5f5f5" stroke="#464feb" stroke-width="2" rx="4"/>
  <rect x="400" y="100" width="200" height="30" fill="#464feb"/>
  <text x="500" y="120" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle">AI Tool 2</text>
  <line x1="400" y1="135" x2="600" y2="135" stroke="#ddd" stroke-width="1"/>
  <text x="410" y="165" font-family="system-ui, sans-serif" font-size="11" fill="#666">Code</text>
  <text x="410" y="185" font-family="system-ui, sans-serif" font-size="11" fill="#666">Drafts</text>
  <circle cx="500" cy="220" r="20" fill="#464feb" opacity="0.15"/>
  <line x1="410" y1="250" x2="590" y2="250" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="410" y1="260" x2="570" y2="260" stroke="#e0e0e0" stroke-width="1"/>
  
  <!-- Window 3: AI Tool 3 -->
  <rect x="630" y="100" width="200" height="260" fill="#f5f5f5" stroke="#464feb" stroke-width="2" rx="4"/>
  <rect x="630" y="100" width="200" height="30" fill="#464feb"/>
  <text x="730" y="120" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle">AI Tool 3</text>
  <line x1="630" y1="135" x2="830" y2="135" stroke="#ddd" stroke-width="1"/>
  <text x="640" y="165" font-family="system-ui, sans-serif" font-size="11" fill="#666">Documentation</text>
  <circle cx="730" cy="220" r="20" fill="#464feb" opacity="0.15"/>
  <line x1="640" y1="250" x2="820" y2="250" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="640" y1="260" x2="800" y2="260" stroke="#e0e0e0" stroke-width="1"/>
  
  <!-- Cursor/eyes darting between windows -->
  <g>
    <!-- Eye 1 looking at window 1 -->
    <circle cx="270" cy="190" r="3" fill="#d32f2f" opacity="0.7"/>
    <!-- Eye 2 looking at window 2 -->
    <circle cx="500" cy="190" r="3" fill="#d32f2f" opacity="0.7"/>
    <!-- Eye 3 looking at window 3 -->
    <circle cx="730" cy="190" r="3" fill="#d32f2f" opacity="0.7"/>
    
    <!-- Stress lines -->
    <line x1="260" y1="175" x2="250" y2="165" stroke="#d32f2f" stroke-width="1.5" opacity="0.6"/>
    <line x1="280" y1="175" x2="290" y2="165" stroke="#d32f2f" stroke-width="1.5" opacity="0.6"/>
  </g>
  
  <!-- Time indicator -->
  <g>
    <circle cx="860" cy="150" r="35" fill="none" stroke="#464feb" stroke-width="2"/>
    <line x1="860" y1="150" x2="860" y2="125" stroke="#464feb" stroke-width="2"/>
    <line x1="860" y1="150" x2="880" y2="150" stroke="#464feb" stroke-width="2"/>
    <text x="880" y="156" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#464feb">2 PM</text>
  </g>
  
  <!-- Keyboard -->
  <rect x="250" y="375" width="500" height="40" fill="#2a2a2a" rx="4"/>
  <circle cx="350" cy="395" r="4" fill="#666"/>
  <circle cx="450" cy="395" r="4" fill="#666"/>
  <circle cx="550" cy="395" r="4" fill="#666"/>
  <circle cx="650" cy="395" r="4" fill="#666"/>
  
  <!-- Title -->
  <text x="500" y="460" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="middle">Cognitive Overload: Juggling Three AI Tools</text>
</svg>