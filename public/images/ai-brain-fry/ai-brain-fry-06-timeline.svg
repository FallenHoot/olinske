<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="300" fill="#ffffff"/>
  
  <!-- Main timeline line -->
  <line x1="100" y1="150" x2="1100" y2="150" stroke="#333" stroke-width="3"/>
  
  <!-- Repeating pattern arrow -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ff6b6b" />
    </marker>
  </defs>
  <path d="M 150 80 Q 400 40 650 80 Q 900 120 1050 80" stroke="#ff6b6b" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="1100" y="65" font-family="system-us" font-size="12" fill="#ff6b6b" font-weight="bold">Pattern Repeats</text>
  
  <!-- 1983: Bainbridge -->
  <g transform="translate(150, 150)">
    <circle r="12" fill="#999" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="-50" x2="0" y2="-80" stroke="#333" stroke-width="2"/>
  </g>
  
  <rect x="90" y="60" width="120" height="35" fill="#f5f5f5" stroke="#333" stroke-width="1" rx="3"/>
  <text x="150" y="75" font-family="system-us" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1983</text>
  <text x="150" y="90" font-family="system-us" font-size="10" fill="#666" text-anchor="middle">Bainbridge</text>
  
  <text x="150" y="200" font-family="system-us" font-size="10" fill="#666" text-anchor="middle" font-style="italic">"Automation Creates</text>
  <text x="150" y="215" font-family="system-us" font-size="10" fill="#666" text-anchor="middle" font-style="italic">Harder Work"</text>
  
  <!-- 1996: Lewis -->
  <g transform="translate(400, 150)">
    <circle r="12" fill="#999" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="-50" x2="0" y2="-80" stroke="#333" stroke-width="2"/>
  </g>
  
  <rect x="340" y="60" width="120" height="35" fill="#f5f5f5" stroke="#333" stroke-width="1" rx="3"/>
  <text x="400" y="75" font-family="system-us" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1996</text>
  <text x="400" y="90" font-family="system-us" font-size="10" fill="#666" text-anchor="middle">Lewis</text>
  
  <text x="400" y="200" font-family="system-us" font-size="10" fill="#666" text-anchor="middle" font-style="italic">"Information</text>
  <text x="400" y="215" font-family="system-us" font-size="10" fill="#666" text-anchor="middle" font-style="italic">Fatigue Syndrome"</text>
  
  <!-- 2007: Tarafdar -->
  <g transform="translate(650, 150)">
    <circle r="12" fill="#999" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="-50" x2="0" y2="-80" stroke="#333" stroke-width="2"/>
  </g>
  
  <rect x="590" y="60" width="120" height="35" fill="#f5f5f5" stroke="#333" stroke-width="1" rx="3"/>
  <text x="650" y="75" font-family="system-us" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2007</text>
  <text x="650" y="90" font-family="system-us" font-size="10" fill="#666" text-anchor="middle">Tarafdar</text>
  
  <text x="650" y="200" font-family="system-us" font-size="10" fill="#666" text-anchor="middle" font-style="italic">"Techno-</text>
  <text x="650" y="215" font-family="system-us" font-size="10" fill="#666" text-anchor="middle" font-style="italic">stressors"</text>
  
  <!-- 2026: BCG/Glean (highlighted in blue) -->
  <g transform="translate(950, 150)">
    <circle r="12" fill="#464feb" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="-50" x2="0" y2="-80" stroke="#464feb" stroke-width="2"/>
  </g>
  
  <rect x="890" y="60" width="120" height="35" fill="#e8eeff" stroke="#464feb" stroke-width="2" rx="3"/>
  <text x="950" y="75" font-family="system-us" font-size="12" font-weight="bold" fill="#464feb" text-anchor="middle">2026</text>
  <text x="950" y="90" font-family="system-us" font-size="10" fill="#464feb" text-anchor="middle">BCG/Glean</text>
  
  <text x="950" y="200" font-family="system-us" font-size="10" fill="#464feb" text-anchor="middle" font-style="italic" font-weight="bold">"AI Brain</text>
  <text x="950" y="215" font-family="system-us" font-size="10" fill="#464feb" text-anchor="middle" font-style="italic" font-weight="bold">Fry"</text>
  
  <!-- Title -->
  <text x="600" y="280" font-family="system-us" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">40 Years of the Same Pattern: Automation Creates Harder Work</text>
</svg>