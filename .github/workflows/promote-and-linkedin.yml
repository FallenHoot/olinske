name: Publish Blog and Post to LinkedIn

# Schedule: Wed+Sat at 11:00 Europe/Oslo. Manual dispatch anytime.
# Full chain: promote to public repo → wait for deploy → post to LinkedIn
#
# Logic:
# 1. Find next approved post (from queue or manual slug input)
# 2. If not yet in content/published/ → promote to public repo
# 3. If LinkedIn post exists in linkedin/posts/ → wait for deploy, then post
# 4. Move LinkedIn post to linkedin/published/

on:
  schedule:
    # Trigger at both possible UTC offsets, then guard on Europe/Oslo local time.
    - cron: '0 9 * * 3,6'
    - cron: '0 10 * * 3,6'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Post slug to publish (e.g., 000045-spring-cleaning-cloud-finops)'
        required: false
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: publish-and-linkedin
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout editorial repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm ci

      # ── Step 1: Find the post to publish ────────────────────
      - name: Detect post
        id: detect
        run: |
          DETECTION=$(MANUAL_SLUG="${{ inputs.slug }}" node -e "
            const fs = require('fs');
            const path = require('path');

            function findFileBySlug(dir, slug) {
              if (!fs.existsSync(dir)) return '';
              const file = fs.readdirSync(dir).find(name => name.startsWith(slug));
              return file ? path.join(dir, file) : '';
            }

            function readPublishDate(filePath) {
              if (!filePath || !fs.existsSync(filePath)) return '';
              const raw = fs.readFileSync(filePath, 'utf8');
              const match = raw.match(/^publishDate:\\s*([0-9]{4}-[0-9]{2}-[0-9]{2})/m);
              return match ? match[1] : '';
            }

            function osloDateISO() {
              const parts = new Intl.DateTimeFormat('en-CA', {
                timeZone: 'Europe/Oslo',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
              }).formatToParts(new Date());
              const byType = Object.fromEntries(parts.filter(p => p.type !== 'literal').map(p => [p.type, p.value]));
              return byType.year + '-' + byType.month + '-' + byType.day;
            }

            function isDue(dueDate, today) {
              if (!dueDate) return true;
              return dueDate <= today;
            }

            const queuePath = 'data/publish-queue.json';
            if (!fs.existsSync(queuePath)) {
              console.log('should_publish=false');
              console.log('reason=publish-queue.json missing');
              process.exit(0);
            }

            const queueData = JSON.parse(fs.readFileSync(queuePath, 'utf8'));
            const queue = Array.isArray(queueData.queue) ? queueData.queue : [];
            const today = osloDateISO();
            const manualSlug = (process.env.MANUAL_SLUG || '').trim();

            const published = fs.existsSync('content/published') ? fs.readdirSync('content/published') : [];
            const linkedinPublished = fs.existsSync('content/linkedin/published') ? fs.readdirSync('content/linkedin/published') : [];
            const linkedinPending = fs.existsSync('content/linkedin/posts') ? fs.readdirSync('content/linkedin/posts') : [];

            const candidates = manualSlug
              ? [{ slug: manualSlug, approved: true, scheduledDate: '' }]
              : queue;

            let selected = null;

            for (const item of candidates) {
              if (!item || !item.slug) continue;
              if (!manualSlug && !item.approved) continue;

              const slug = item.slug;
              const postInPosts = findFileBySlug('content/posts', slug);
              const postInPublished = findFileBySlug('content/published', slug);

              const blogDone = published.some(name => name.startsWith(slug));
              const linkedinDone = linkedinPublished.some(name => name.startsWith(slug));
              const needsPromote = !blogDone && !!postInPosts;
              const needsLinkedIn = linkedinPending.some(name => name.startsWith(slug));

              if (!needsPromote && !needsLinkedIn) {
                continue;
              }

              const postDate = readPublishDate(postInPosts || postInPublished);
              const dueDate = item.scheduledDate || postDate;

              if (!manualSlug && !isDue(dueDate, today)) {
                continue;
              }

              selected = {
                slug,
                dueDate,
                needsPromote,
                needsLinkedIn
              };
              break;
            }

            if (!selected) {
              console.log('should_publish=false');
              console.log('reason=no due approved post requires action');
              process.exit(0);
            }

            console.log('should_publish=true');
            console.log('slug=' + selected.slug);
            console.log('due_date=' + (selected.dueDate || ''));
            console.log('needs_promote=' + (selected.needsPromote ? 'true' : 'false'));
            console.log('needs_linkedin=' + (selected.needsLinkedIn ? 'true' : 'false'));
            console.log('reason=selected ' + selected.slug);
          ")

          while IFS= read -r line; do
            [ -n "$line" ] && echo "$line" >> "$GITHUB_OUTPUT"
          done <<< "$DETECTION"

          SHOULD_PUBLISH=$(printf '%s\n' "$DETECTION" | sed -n 's/^should_publish=//p' | tail -1)
          SLUG=$(printf '%s\n' "$DETECTION" | sed -n 's/^slug=//p' | tail -1)
          DUE_DATE=$(printf '%s\n' "$DETECTION" | sed -n 's/^due_date=//p' | tail -1)
          NEEDS_PROMOTE=$(printf '%s\n' "$DETECTION" | sed -n 's/^needs_promote=//p' | tail -1)
          NEEDS_LINKEDIN=$(printf '%s\n' "$DETECTION" | sed -n 's/^needs_linkedin=//p' | tail -1)

          if [ "$SHOULD_PUBLISH" = "false" ]; then
            echo "No due approved post requires action."
          else
            echo "Slug: ${SLUG} | Due: ${DUE_DATE} | Promote: ${NEEDS_PROMOTE} | LinkedIn: ${NEEDS_LINKEDIN}"
          fi

      - name: Publish decision summary
        run: |
          echo "Decision: ${{ steps.detect.outputs.reason }}"
          echo "Slug: ${{ steps.detect.outputs.slug }}"
          echo "Due date: ${{ steps.detect.outputs.due_date }}"
          echo "Promote: ${{ steps.detect.outputs.needs_promote }}"
          echo "LinkedIn: ${{ steps.detect.outputs.needs_linkedin }}"

      # ── Step 2: Promote to public repo (if needed) ──────────
      - name: Promote blog post
        id: promote
        if: steps.detect.outputs.should_publish == 'true' && steps.detect.outputs.needs_promote == 'true'
        run: |
          SLUG="${{ steps.detect.outputs.slug }}"
          POST_FILE=$(ls content/posts/ | grep "^${SLUG}" | head -1)

          if [ -z "$POST_FILE" ]; then
            echo "No staged post found for slug ${SLUG}."
            exit 1
          fi

          # Update status and date
          sed -i "s/^status: .*/status: published/" "content/posts/${POST_FILE}"
          sed -i "s/^publishDate: .*/publishDate: $(date -u +%Y-%m-%d)/" "content/posts/${POST_FILE}"

          # Move to published
          cp "content/posts/${POST_FILE}" "content/published/${POST_FILE}"
          rm "content/posts/${POST_FILE}"
          echo "Moved to content/published/${POST_FILE}"

          # Commit to editorial repo
          git config user.name "publish-bot[bot]"
          git config user.email "publish-bot[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No publish changes detected."
          else
            git commit -m "bot: publish ${SLUG}"
            git push
            echo "Repository updated. Azure deploy will trigger."
          fi

          echo "promoted=true" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy workflow
        if: steps.detect.outputs.should_publish == 'true' && steps.promote.outputs.promoted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "Deploy to Azure Web App" --ref main

      # ── Step 3: Wait for blog to deploy (only if we just promoted) ──
      - name: Wait for blog to deploy
        if: steps.detect.outputs.should_publish == 'true' && steps.promote.outputs.promoted == 'true' && steps.detect.outputs.needs_linkedin == 'true'
        run: |
          echo "Waiting 60 minutes for Azure to deploy the blog..."
          echo "Started at: $(date -u)"
          sleep 3600
          echo "Wait complete at: $(date -u)"

      - name: Validate LinkedIn post guardrails
        if: steps.detect.outputs.should_publish == 'true' && steps.detect.outputs.needs_linkedin == 'true'
        run: |
          SLUG="${{ steps.detect.outputs.slug }}"
          POST_FILE=$(ls content/published/ | grep "^${SLUG}" | head -1)

          echo "Validating LinkedIn guardrails for ${SLUG}"
          node scripts/post-to-linkedin.mjs --post "content/published/${POST_FILE}" --variant medium --dry-run

      # ── Step 4: Post to LinkedIn (if needed) ────────────────
      - name: Post to LinkedIn
        if: steps.detect.outputs.should_publish == 'true' && steps.detect.outputs.needs_linkedin == 'true'
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
        run: |
          SLUG="${{ steps.detect.outputs.slug }}"
          POST_FILE=$(ls content/published/ | grep "^${SLUG}" | head -1)

          echo "Posting LinkedIn for ${SLUG}"
          node scripts/post-to-linkedin.mjs --post "content/published/${POST_FILE}" --variant medium

      # ── Step 5: Move LinkedIn post to published ─────────────
      - name: Move LinkedIn post to published
        if: steps.detect.outputs.should_publish == 'true' && steps.detect.outputs.needs_linkedin == 'true'
        run: |
          SLUG="${{ steps.detect.outputs.slug }}"
          LINKEDIN_POST=$(ls content/linkedin/posts/ 2>/dev/null | grep "^${SLUG}" | head -1)

          if [ -n "$LINKEDIN_POST" ]; then
            mkdir -p content/linkedin/published
            mv "content/linkedin/posts/${LINKEDIN_POST}" "content/linkedin/published/${LINKEDIN_POST}"
          fi

          git config user.name "publish-bot[bot]"
          git config user.email "publish-bot[bot]@users.noreply.github.com"
          git add -A
          git commit -m "bot: linkedin posted ${SLUG}" || true
          git push || true
