<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="400" fill="#ffffff"/>
  
  <!-- Three pillar containers -->
  <defs>
    <linearGradient id="pillarGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#464feb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d3ad9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- PILLAR 1: Span of Oversight -->
  <g transform="translate(100, 80)">
    <!-- Pillar body -->
    <rect x="0" y="0" width="280" height="240" fill="url(#pillarGradient)" rx="8"/>
    
    <!-- Icon: Manager with people -->
    <circle cx="140" cy="50" r="18" fill="white" opacity="0.9"/>
    <text x="140" y="57" font-family="system-us" font-size="24" fill="#464feb" text-anchor="middle" font-weight="bold">👤</text>
    
    <circle cx="100" cy="90" r="12" fill="white" opacity="0.7"/>
    <circle cx="140" cy="100" r="12" fill="white" opacity="0.7"/>
    <circle cx="180" cy="90" r="12" fill="white" opacity="0.7"/>
    
    <!-- Title -->
    <text x="140" y="150" font-family="system-us" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Span of</text>
    <text x="140" y="175" font-family="system-us" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Oversight</text>
    
    <!-- Subtitle -->
    <text x="140" y="210" font-family="system-us" font-size="12" fill="white" text-anchor="middle" opacity="0.9">Set Oversight Limits</text>
    <text x="140" y="230" font-family="system-us" font-size="12" fill="white" text-anchor="middle" opacity="0.9">Max 3 AI tools per person</text>
  </g>
  
  <!-- PILLAR 2: Decision-Making Skills -->
  <g transform="translate(460, 80)">
    <!-- Pillar body -->
    <rect x="0" y="0" width="280" height="240" fill="url(#pillarGradient)" rx="8"/>
    
    <!-- Icon: Brain + Gear -->
    <circle cx="140" cy="50" r="20" fill="white" opacity="0.2"/>
    <path d="M 130 50 Q 140 40 150 50 Q 150 60 140 65 Q 130 60 130 50" fill="white" opacity="0.9"/>
    <circle cx="155" cy="50" r="8" fill="white" opacity="0.7"/>
    <circle cx="155" cy="50" r="6" fill="#464feb" opacity="0.5"/>
    
    <!-- Title -->
    <text x="140" y="150" font-family="system-us" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Decision-Making</text>
    <text x="140" y="175" font-family="system-us" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Skills</text>
    
    <!-- Subtitle -->
    <text x="140" y="210" font-family="system-us" font-size="12" fill="white" text-anchor="middle" opacity="0.9">Train Meta-Skills</text>
    <text x="140" y="230" font-family="system-us" font-size="12" fill="white" text-anchor="middle" opacity="0.9">When & why to use AI</text>
  </g>
  
  <!-- PILLAR 3: Metrics Redesign -->
  <g transform="translate(820, 80)">
    <!-- Pillar body -->
    <rect x="0" y="0" width="280" height="240" fill="url(#pillarGradient)" rx="8"/>
    
    <!-- Icon: Chart/Dashboard -->
    <rect x="120" y="30" width="40" height="50" fill="white" opacity="0.2" rx="2"/>
    <rect x="120" y="60" width="40" height="20" fill="white" opacity="0.9" rx="2"/>
    <rect x="125" y="50" width="8" height="30" fill="white" opacity="0.9"/>
    <rect x="138" y="45" width="8" height="35" fill="white" opacity="0.9"/>
    <rect x="151" y="55" width="8" height="25" fill="white" opacity="0.9"/>
    
    <!-- Title -->
    <text x="140" y="150" font-family="system-us" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Metrics</text>
    <text x="140" y="175" font-family="system-us" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Redesign</text>
    
    <!-- Subtitle -->
    <text x="140" y="210" font-family="system-us" font-size="12" fill="white" text-anchor="middle" opacity="0.9">Measure Outcomes</text>
    <text x="140" y="230" font-family="system-us" font-size="12" fill="white" text-anchor="middle" opacity="0.9">Business impact, not adoption</text>
  </g>
  
  <!-- Base connection line showing they work together -->
  <line x1="140" y1="340" x2="1040" y2="340" stroke="#464feb" stroke-width="4" opacity="0.8"/>
  
  <!-- Connection dots -->
  <circle cx="240" cy="340" r="8" fill="#464feb"/>
  <circle cx="600" cy="340" r="8" fill="#464feb"/>
  <circle cx="960" cy="340" r="8" fill="#464feb"/>
  
  <!-- Bottom text -->
  <text x="600" y="375" font-family="system-us" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">All three work together as an integrated system</text>
</svg>