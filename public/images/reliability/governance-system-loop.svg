<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Reliability Governance Loop</title>
  <desc id="desc">Tiering, ADRs, debt ledger, and leading indicators create a repeatable governance loop.</desc>
  <defs>
    <style>
      .bg { fill: #f4faf9; }
      .node { fill: #ffffff; stroke: #1f6658; stroke-width: 2; rx: 12; }
      .txtH { fill: #15473d; font-family: Segoe UI, Arial, sans-serif; font-size: 25px; font-weight: 700; }
      .txtN { fill: #1d5b4f; font-family: Segoe UI, Arial, sans-serif; font-size: 20px; font-weight: 700; }
      .arrow { stroke: #21806d; stroke-width: 4; marker-end: url(#m); fill: none; }
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#21806d"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="760"/>
  <text x="600" y="58" text-anchor="middle" class="txtH">Reliability Governance System</text>

  <rect class="node" x="500" y="120" width="200" height="84"/>
  <text x="600" y="170" text-anchor="middle" class="txtN">Tiering</text>

  <rect class="node" x="860" y="280" width="220" height="84"/>
  <text x="970" y="330" text-anchor="middle" class="txtN">Reliability ADRs</text>

  <rect class="node" x="740" y="540" width="260" height="84"/>
  <text x="870" y="590" text-anchor="middle" class="txtN">Debt Ledger</text>

  <rect class="node" x="200" y="540" width="300" height="84"/>
  <text x="350" y="590" text-anchor="middle" class="txtN">Leading Indicators</text>

  <rect class="node" x="120" y="280" width="260" height="84"/>
  <text x="250" y="330" text-anchor="middle" class="txtN">Monthly Review</text>

  <path class="arrow" d="M700 162 L860 280"/>
  <path class="arrow" d="M970 364 L870 540"/>
  <path class="arrow" d="M740 582 L500 582"/>
  <path class="arrow" d="M280 540 L250 364"/>
  <path class="arrow" d="M310 280 L500 162"/>
</svg>
