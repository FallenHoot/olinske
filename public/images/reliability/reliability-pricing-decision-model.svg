<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="system-ui, -apple-system, sans-serif">

  <!-- Background -->
  <rect width="900" height="560" fill="#0f172a" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#f1f5f9">Reliability Pricing Decision Model</text>
  <text x="450" y="56" text-anchor="middle" font-size="11" fill="#94a3b8">Break-even churn threshold and tiered packaging</text>

  <!-- ── LEFT PANEL: Break-even formula ── -->
  <rect x="30" y="74" width="260" height="200" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1"/>
  <text x="160" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#e2e8f0">Break-even Threshold</text>

  <!-- Formula box -->
  <rect x="50" y="108" width="220" height="44" fill="#0f172a" rx="6" stroke="#475569" stroke-width="1"/>
  <text x="160" y="126" text-anchor="middle" font-size="11" fill="#94a3b8">s  =  1  −  ( M / M' )</text>
  <text x="160" y="143" text-anchor="middle" font-size="10" fill="#64748b">churn ceiling before value is destroyed</text>

  <!-- Variable list -->
  <text x="50" y="168" font-size="10" fill="#94a3b8">M   = current margin / seat ($40)</text>
  <text x="50" y="183" font-size="10" fill="#94a3b8">M'  = new margin at raised price ($60)</text>
  <text x="50" y="198" font-size="10" fill="#94a3b8">s   = break-even churn  →  33.3%</text>

  <!-- Outcome labels -->
  <rect x="50" y="212" width="100" height="24" fill="#14532d" rx="4"/>
  <text x="100" y="228" text-anchor="middle" font-size="10" font-weight="700" fill="#86efac">churn &lt; 33%  ✓</text>
  <rect x="162" y="212" width="108" height="24" fill="#7f1d1d" rx="4"/>
  <text x="216" y="228" text-anchor="middle" font-size="10" font-weight="700" fill="#fca5a5">churn &gt; 33%  ✗</text>

  <text x="50" y="256" font-size="9" fill="#64748b">Example: P=$100→$150, C=$50→$90</text>
  <text x="50" y="269" font-size="9" fill="#64748b">M'=$60  →  s = 1−(40/60) = 33.3%</text>

  <!-- ── CENTER PANEL: Scenario flow ── -->
  <rect x="310" y="74" width="280" height="200" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1"/>
  <text x="450" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#e2e8f0">The Margin Trap Scenario</text>

  <!-- Node: Current state -->
  <rect x="340" y="108" width="220" height="36" fill="#1d4ed8" rx="6"/>
  <text x="450" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Current: $100/seat, $40 margin</text>
  <text x="450" y="137" text-anchor="middle" font-size="10" fill="#bfdbfe">Incidents → churn risk</text>

  <!-- Arrow down -->
  <line x1="450" y1="144" x2="450" y2="160" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node: Upgrade cost -->
  <rect x="340" y="160" width="220" height="36" fill="#92400e" rx="6"/>
  <text x="450" y="174" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Upgrade cost: +$30/seat</text>
  <text x="450" y="189" text-anchor="middle" font-size="10" fill="#fde68a">New margin = $10  →  not viable</text>

  <!-- Arrow down -->
  <line x1="450" y1="196" x2="450" y2="212" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node: Price increase -->
  <rect x="340" y="212" width="220" height="36" fill="#6d28d9" rx="6"/>
  <text x="450" y="226" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Raise price to $150/seat</text>
  <text x="450" y="241" text-anchor="middle" font-size="10" fill="#ddd6fe">M'=$60  →  viable if churn &lt; 33%</text>

  <!-- ── RIGHT PANEL: Tier packaging ── -->
  <rect x="610" y="74" width="260" height="200" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1"/>
  <text x="740" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#e2e8f0">Tiered Reliability Packaging</text>

  <!-- Tier 1 -->
  <rect x="626" y="108" width="228" height="48" fill="#14532d" rx="6"/>
  <text x="740" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#86efac">Tier 1 — Mission-Critical</text>
  <text x="740" y="136" text-anchor="middle" font-size="10" fill="#d1fae5">Multi-region, 99.9% SLA, 4h RTO</text>
  <text x="740" y="149" text-anchor="middle" font-size="10" fill="#d1fae5">Premium price  |  Enterprise accounts</text>

  <!-- Tier 2 -->
  <rect x="626" y="164" width="228" height="48" fill="#1e3a5f" rx="6"/>
  <text x="740" y="178" text-anchor="middle" font-size="11" font-weight="700" fill="#93c5fd">Tier 2 — Business-Critical</text>
  <text x="740" y="192" text-anchor="middle" font-size="10" fill="#bfdbfe">Single-region, 99.5% SLA, 24h RTO</text>
  <text x="740" y="205" text-anchor="middle" font-size="10" fill="#bfdbfe">Current price  |  Majority base</text>

  <!-- Tier 3 -->
  <rect x="626" y="220" width="228" height="48" fill="#1e293b" rx="6" stroke="#475569" stroke-width="1"/>
  <text x="740" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#94a3b8">Tier 3 — Standard</text>
  <text x="740" y="248" text-anchor="middle" font-size="10" fill="#64748b">Best-effort, no SLA, self-service</text>
  <text x="740" y="261" text-anchor="middle" font-size="10" fill="#64748b">Reduced price  |  Dev/SMB segments</text>

  <!-- ── BOTTOM PANEL: Three responses ── -->
  <text x="450" y="302" text-anchor="middle" font-size="12" font-weight="700" fill="#e2e8f0">When Projected Churn Exceeds Break-even Threshold</text>

  <!-- Response 1 -->
  <rect x="30" y="314" width="260" height="80" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1"/>
  <text x="160" y="332" text-anchor="middle" font-size="11" font-weight="700" fill="#fbbf24">Option 1: Delay and Qualify</text>
  <text x="160" y="348" text-anchor="middle" font-size="10" fill="#94a3b8">Grow enterprise account base first.</text>
  <text x="160" y="363" text-anchor="middle" font-size="10" fill="#94a3b8">Upgrade only when Tier 1 pipeline</text>
  <text x="160" y="378" text-anchor="middle" font-size="10" fill="#94a3b8">can absorb the cost floor.</text>

  <!-- Response 2 -->
  <rect x="310" y="314" width="280" height="80" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1"/>
  <text x="450" y="332" text-anchor="middle" font-size="11" font-weight="700" fill="#34d399">Option 2: Reduce Cost Floor</text>
  <text x="450" y="348" text-anchor="middle" font-size="10" fill="#94a3b8">Concentrate reliability investment in</text>
  <text x="450" y="363" text-anchor="middle" font-size="10" fill="#94a3b8">mission-critical journeys only.</text>
  <text x="450" y="378" text-anchor="middle" font-size="10" fill="#94a3b8">$15/seat for 20% beats $30 for all.</text>

  <!-- Response 3 -->
  <rect x="610" y="314" width="260" height="80" fill="#1e293b" rx="8" stroke="#7f1d1d" stroke-width="1"/>
  <text x="740" y="332" text-anchor="middle" font-size="11" font-weight="700" fill="#f87171">Option 3: Strategic Reset</text>
  <text x="740" y="348" text-anchor="middle" font-size="10" fill="#94a3b8">Current price point is structurally</text>
  <text x="740" y="363" text-anchor="middle" font-size="10" fill="#94a3b8">impaired. Requires positioning review,</text>
  <text x="740" y="378" text-anchor="middle" font-size="10" fill="#94a3b8">not a reliability upgrade.</text>

  <!-- ── BOTTOM RULE ── -->
  <rect x="30" y="416" width="840" height="60" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1"/>
  <text x="450" y="436" text-anchor="middle" font-size="11" font-weight="700" fill="#e2e8f0">Commercial Framing Rule</text>
  <text x="450" y="454" text-anchor="middle" font-size="10" fill="#ef4444">Wrong:  "We are investing in reliability, which requires a price adjustment to maintain margins."</text>
  <text x="450" y="470" text-anchor="middle" font-size="10" fill="#86efac">Correct: "We are introducing a contractual availability guarantee for the workflows that generate your revenue."</text>

  <!-- ── FOOTER ── -->
  <text x="450" y="510" text-anchor="middle" font-size="10" fill="#475569">Reliability Survival Guide — Chapter 11</text>
  <text x="450" y="525" text-anchor="middle" font-size="9" fill="#334155">zach.olinske.com</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
  </defs>

</svg>
