<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="500" fill="#ffffff"/>
  
  <!-- Desk -->
  <rect x="100" y="280" width="1000" height="150" fill="#f0f0f0" rx="8"/>
  
  <!-- Person -->
  <circle cx="150" cy="120" r="25" fill="#d4a574"/>
  <rect x="130" y="150" width="40" height="60" fill="#d4a574"/>
  <circle cx="130" cy="160" r="8" fill="#d4a574"/>
  <circle cx="170" cy="160" r="8" fill="#d4a574"/>
  
  <!-- Three Monitors -->
  <!-- Monitor 1 -->
  <rect x="250" y="100" width="200" height="150" fill="#1a1a1a" stroke="#333" stroke-width="2" rx="4"/>
  <rect x="260" y="110" width="180" height="120" fill="#f5f5f5" stroke="#464feb" stroke-width="2"/>
  <text x="350" y="135" font-family="system-us" font-size="12" font-weight="bold" fill="#464feb" text-anchor="middle">Tool A</text>
  <circle cx="350" cy="160" r="20" fill="#464feb" opacity="0.3"/>
  
  <!-- Monitor 2 -->
  <rect x="500" y="100" width="200" height="150" fill="#1a1a1a" stroke="#333" stroke-width="2" rx="4"/>
  <rect x="510" y="110" width="180" height="120" fill="#f5f5f5" stroke="#464feb" stroke-width="2"/>
  <text x="600" y="135" font-family="system-us" font-size="12" font-weight="bold" fill="#464feb" text-anchor="middle">Tool B</text>
  <circle cx="600" cy="160" r="20" fill="#464feb" opacity="0.3"/>
  
  <!-- Monitor 3 -->
  <rect x="750" y="100" width="200" height="150" fill="#1a1a1a" stroke="#333" stroke-width="2" rx="4"/>
  <rect x="760" y="110" width="180" height="120" fill="#f5f5f5" stroke="#464feb" stroke-width="2"/>
  <text x="850" y="135" font-family="system-us" font-size="12" font-weight="bold" fill="#464feb" text-anchor="middle">Tool C</text>
  <circle cx="850" cy="160" r="20" fill="#464feb" opacity="0.3"/>
  
  <!-- Attention residue ghosts (translucent) -->
  <!-- Ghost from Tool A -->
  <rect x="250" y="50" width="60" height="40" fill="#999" opacity="0.2" stroke="#999" stroke-width="1" stroke-dasharray="3,3" rx="3"/>
  <text x="280" y="75" font-family="system-us" font-size="9" fill="#999" text-anchor="middle" opacity="0.5">Task 1</text>
  
  <!-- Ghost from Tool B -->
  <rect x="550" y="50" width="60" height="40" fill="#999" opacity="0.2" stroke="#999" stroke-width="1" stroke-dasharray="3,3" rx="3"/>
  <text x="580" y="75" font-family="system-us" font-size="9" fill="#999" text-anchor="middle" opacity="0.5">Task 2</text>
  
  <!-- Ghost from Tool C -->
  <rect x="800" y="50" width="60" height="40" fill="#999" opacity="0.2" stroke="#999" stroke-width="1" stroke-dasharray="3,3" rx="3"/>
  <text x="830" y="75" font-family="system-us" font-size="9" fill="#999" text-anchor="middle" opacity="0.5">Task 3</text>
  
  <!-- Arrows showing attention pulled in multiple directions -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ff9800" />
    </marker>
  </defs>
  
  <path d="M 200 150 L 280 150" stroke="#ff9800" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="5,5"/>
  <path d="M 200 150 L 530 150" stroke="#ff9800" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="5,5"/>
  <path d="M 200 150 L 780 150" stroke="#ff9800" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="5,5"/>
  
  <!-- Brain illustration showing divided attention -->
  <g transform="translate(980, 140)">
    <!-- Brain outline -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#464feb" stroke-width="2"/>
    
    <!-- Three sections -->
    <path d="M -45 0 Q -30 -30 0 -45 Q 0 -20 0 0" fill="#464feb" opacity="0.8"/>
    <path d="M 0 -45 Q 30 -30 45 0 Q 20 0 0 0" fill="#464feb" opacity="0.5"/>
    <path d="M 0 0 Q 20 20 45 0 Q 30 30 0 45 Q 0 20 0 0" fill="#464feb" opacity="0.3"/>
    
    <text x="0" y="5" font-family="system-us" font-size="9" fill="white" text-anchor="middle" font-weight="bold">A</text>
  </g>
  
  <!-- Labels -->
  <text x="350" y="270" font-family="system-us" font-size="11" fill="#666" text-anchor="middle" font-weight="bold">Active Attention</text>
  <text x="350" y="290" font-family="system-us" font-size="10" fill="#999" text-anchor="middle">(Primary focus)</text>
  
  <text x="900" y="270" font-family="system-us" font-size="11" fill="#999" text-anchor="middle" font-weight="bold">Attention Residue</text>
  <text x="900" y="290" font-family="system-us" font-size="10" fill="#999" text-anchor="middle">(Lingers from previous tasks)</text>
  
  <!-- Main title -->
  <text x="600" y="360" font-family="system-us" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Attention Residue: Cognitive Load Fragments Across Tools</text>
</svg>