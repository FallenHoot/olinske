<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="700" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="500" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#1a1a1a" text-anchor="middle">The Confidence Spiral</text>
  <text x="500" y="65" font-family="system-ui, sans-serif" font-size="14" fill="#666" text-anchor="middle">How oversight burden deepens with each cycle</text>
  
  <!-- Center point -->
  <circle cx="500" cy="350" r="3" fill="#464feb"/>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#d32f2f" />
    </marker>
  </defs>
  
  <!-- Spiral guide (dashed) -->
  <path d="M 500 140 Q 580 160 600 240 Q 590 320 520 360 Q 420 400 380 320 Q 390 240 480 160" 
        fill="none" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  
  <!-- Stage 1: Professional Confidence (top) -->
  <g>
    <circle cx="500" cy="140" r="48" fill="#e8f5e9" stroke="#4caf50" stroke-width="3"/>
    <text x="500" y="135" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2e7d32" text-anchor="middle">Professional</text>
    <text x="500" y="152" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2e7d32" text-anchor="middle">Confidence</text>
  </g>
  
  <!-- Arrow down to next stage -->
  <path d="M 500 190 L 500 210" stroke="#d32f2f" stroke-width="3" marker-end="url(#arrowRed)"/>
  
  <!-- Stage 2: Confidence Loss (right) -->
  <g>
    <circle cx="600" cy="240" r="48" fill="#fff3e0" stroke="#ff9800" stroke-width="3"/>
    <text x="600" y="235" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#e65100" text-anchor="middle">Confidence</text>
    <text x="600" y="252" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#e65100" text-anchor="middle">Loss</text>
  </g>
  
  <!-- Arrow down-left -->
  <path d="M 570 280 L 530 320" stroke="#d32f2f" stroke-width="3" marker-end="url(#arrowRed)"/>
  
  <!-- Stage 3: Over-reliance on AI (bottom) -->
  <g>
    <circle cx="500" cy="360" r="48" fill="#fce4ec" stroke="#e91e63" stroke-width="3"/>
    <text x="500" y="355" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ad1457" text-anchor="middle">Over-reliance</text>
    <text x="500" y="372" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ad1457" text-anchor="middle">on AI</text>
  </g>
  
  <!-- Arrow up-left -->
  <path d="M 455 325 L 415 280" stroke="#d32f2f" stroke-width="3" marker-end="url(#arrowRed)"/>
  
  <!-- Stage 4: Increased Oversight (left) -->
  <g>
    <circle cx="380" cy="240" r="48" fill="#f3e5f5" stroke="#9c27b0" stroke-width="3"/>
    <text x="380" y="235" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#6a1b9a" text-anchor="middle">Increased</text>
    <text x="380" y="252" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#6a1b9a" text-anchor="middle">Oversight</text>
  </g>
  
  <!-- Arrow back up -->
  <path d="M 410 200 L 480 160" stroke="#d32f2f" stroke-width="3" marker-end="url(#arrowRed)"/>
  
  <!-- Cycle number indicators -->
  <text x="530" y="140" font-family="system-ui, sans-serif" font-size="11" fill="#999" text-anchor="start">Cycle 1</text>
  
  <!-- Inner spiral (second cycle, lower) -->
  <circle cx="510" cy="250" r="38" fill="#ffe0e0" stroke="#d32f2f" stroke-width="2" opacity="0.6"/>
  <text x="510" y="255" font-family="system-ui, sans-serif" font-size="12" fill="#d32f2f" text-anchor="middle">Cycle 2</text>
  <text x="510" y="268" font-family="system-ui, sans-serif" font-size="10" fill="#d32f2f" text-anchor="middle">(Worse)</text>
  
  <!-- Innermost (third cycle, even lower) -->
  <circle cx="500" cy="295" r="28" fill="#ffcccc" stroke="#c62828" stroke-width="2" opacity="0.7"/>
  <text x="500" y="300" font-family="system-ui, sans-serif" font-size="10" fill="#c62828" text-anchor="middle">Cycle 3</text>
  
  <!-- Explanation box -->
  <rect x="80" y="480" width="840" height="180" rx="8" fill="#f8f9ff" stroke="#464feb" stroke-width="2"/>
  
  <text x="500" y="520" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle">Each Cycle Deepens the Problem</text>
  
  <text x="500" y="555" font-family="system-ui, sans-serif" font-size="13" fill="#333" text-anchor="middle">Professional confidence erodes → second-guessing intensifies →</text>
  
  <text x="500" y="575" font-family="system-ui, sans-serif" font-size="13" fill="#333" text-anchor="middle">over-reliance on AI validation increases → oversight demands grow →</text>
  
  <text x="500" y="595" font-family="system-ui, sans-serif" font-size="13" fill="#333" text-anchor="middle">more brain fry → even lower confidence → the cycle repeats</text>
  
  <text x="500" y="630" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#d32f2f" text-anchor="middle">Without intervention, the spiral accelerates.</text>
</svg>