<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="600" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="500" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#1a1a1a" text-anchor="middle">Confidence Erosion Feedback Loop</text>
  <text x="500" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#666666" text-anchor="middle">How each stage triggers the next, compounding brain fry</text>
  
  <!-- Defs -->
  <defs>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#464feb" />
    </marker>
  </defs>
  
  <!-- Stage 1: Confidence Loss -->
  <g>
    <!-- Card background -->
    <rect x="50" y="100" width="160" height="140" rx="8" fill="#f0f4ff" stroke="#464feb" stroke-width="2"/>
    
    <!-- Number badge -->
    <circle cx="220" cy="115" r="16" fill="#464feb"/>
    <text x="220" y="121" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">1</text>
    
    <!-- Icon -->
    <g transform="translate(130, 130)">
      <!-- Head outline -->
      <circle cx="0" cy="0" r="18" fill="none" stroke="#464feb" stroke-width="2"/>
      <!-- Brain shape -->
      <path d="M -8 -5 Q -8 -12 0 -14 Q 8 -12 8 -5" fill="none" stroke="#464feb" stroke-width="2" stroke-linecap="round"/>
      <!-- Down arrow inside -->
      <path d="M 0 0 L 0 10 M -3 7 L 0 10 L 3 7" fill="none" stroke="#464feb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Label -->
    <text x="130" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Confidence</text>
    <text x="130" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Loss</text>
  </g>
  
  <!-- Arrow 1 -->
  <path d="M 220 170 L 280 170" stroke="#464feb" stroke-width="3" fill="none" marker-end="url(#arrowblue)" stroke-linecap="round"/>
  
  <!-- Stage 2: Second-Guessing -->
  <g>
    <!-- Card background -->
    <rect x="280" y="100" width="160" height="140" rx="8" fill="#f0f4ff" stroke="#464feb" stroke-width="2"/>
    
    <!-- Number badge -->
    <circle cx="460" cy="115" r="16" fill="#464feb"/>
    <text x="460" y="121" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">2</text>
    
    <!-- Icon -->
    <g transform="translate(360, 130)">
      <!-- Question mark -->
      <circle cx="0" cy="0" r="20" fill="none" stroke="#464feb" stroke-width="2"/>
      <text x="0" y="8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#464feb" text-anchor="middle">?</text>
    </g>
    
    <!-- Label -->
    <text x="360" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Second-Guesses</text>
    <text x="360" y="193" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Decisions</text>
  </g>
  
  <!-- Arrow 2 -->
  <path d="M 450 170 L 510 170" stroke="#464feb" stroke-width="3" fill="none" marker-end="url(#arrowblue)" stroke-linecap="round"/>
  
  <!-- Stage 3: Over-Relies on AI -->
  <g>
    <!-- Card background -->
    <rect x="510" y="100" width="160" height="140" rx="8" fill="#f0f4ff" stroke="#464feb" stroke-width="2"/>
    
    <!-- Number badge -->
    <circle cx="690" cy="115" r="16" fill="#464feb"/>
    <text x="690" y="121" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">3</text>
    
    <!-- Icon -->
    <g transform="translate(590, 130)">
      <!-- Brain circuit -->
      <circle cx="0" cy="0" r="20" fill="none" stroke="#464feb" stroke-width="2"/>
      <!-- Circuit lines -->
      <line x1="-10" y1="-8" x2="10" y2="-8" stroke="#464feb" stroke-width="1.5"/>
      <line x1="-10" y1="0" x2="10" y2="0" stroke="#464feb" stroke-width="1.5"/>
      <line x1="-10" y1="8" x2="10" y2="8" stroke="#464feb" stroke-width="1.5"/>
      <!-- Connecting dots -->
      <circle cx="-10" cy="-8" r="2" fill="#464feb"/>
      <circle cx="10" cy="-8" r="2" fill="#464feb"/>
      <circle cx="-10" cy="0" r="2" fill="#464feb"/>
      <circle cx="10" cy="0" r="2" fill="#464feb"/>
    </g>
    
    <!-- Label -->
    <text x="590" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Over-Relies</text>
    <text x="590" y="193" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">on AI</text>
  </g>
  
  <!-- Arrow 3 -->
  <path d="M 680 170 L 740 170" stroke="#464feb" stroke-width="3" fill="none" marker-end="url(#arrowblue)" stroke-linecap="round"/>
  
  <!-- Stage 4: More Oversight -->
  <g>
    <!-- Card background -->
    <rect x="740" y="100" width="160" height="140" rx="8" fill="#f0f4ff" stroke="#464feb" stroke-width="2"/>
    
    <!-- Number badge -->
    <circle cx="920" cy="115" r="16" fill="#464feb"/>
    <text x="920" y="121" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">4</text>
    
    <!-- Icon -->
    <g transform="translate(820, 130)">
      <!-- Arrows expanding outward -->
      <g fill="none" stroke="#464feb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 0 0 L -12 -12 M -10 -12 L -12 -12 L -12 -10"/>
        <path d="M 0 0 L 12 -12 M 10 -12 L 12 -12 L 12 -10"/>
        <path d="M 0 0 L -12 12 M -10 12 L -12 12 L -12 10"/>
        <path d="M 0 0 L 12 12 M 10 12 L 12 12 L 12 10"/>
      </g>
    </g>
    
    <!-- Label -->
    <text x="820" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">More</text>
    <text x="820" y="193" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Oversight</text>
  </g>
  
  <!-- Loop arrow from Stage 4 back down to Stage 5 -->
  <path d="M 820 240 L 820 310" stroke="#464feb" stroke-width="3" fill="none" marker-end="url(#arrowblue)" stroke-linecap="round"/>
  
  <!-- Stage 5: Brain Fry (Bottom center - larger emphasis) -->
  <g>
    <!-- Background glow -->
    <circle cx="500" cy="420" r="95" fill="#ffe8e8" opacity="0.5"/>
    
    <!-- Card background - larger -->
    <rect x="380" y="310" width="240" height="160" rx="12" fill="#fff5f5" stroke="#d32f2f" stroke-width="3"/>
    
    <!-- Icon: Stressed brain -->
    <g transform="translate(500, 365)">
      <!-- Head outline larger -->
      <circle cx="0" cy="0" r="28" fill="none" stroke="#d32f2f" stroke-width="2.5"/>
      <!-- Brain -->
      <path d="M -12 -8 Q -12 -18 0 -20 Q 12 -18 12 -8" fill="none" stroke="#d32f2f" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Stress lines -->
      <g stroke="#d32f2f" stroke-width="2.5" stroke-linecap="round">
        <line x1="-38" y1="-12" x2="-48" y2="-18"/>
        <line x1="-38" y1="0" x2="-48" y2="0"/>
        <line x1="38" y1="-12" x2="48" y2="-18"/>
        <line x1="38" y1="0" x2="48" y2="0"/>
      </g>
    </g>
    
    <!-- Label -->
    <text x="500" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#d32f2f" text-anchor="middle">Brain Fry</text>
  </g>
  
  <!-- Loop arrow from Stage 5 back to Stage 1 -->
  <path d="M 380 390 Q 200 280 130 240" stroke="#d32f2f" stroke-width="3" fill="none" stroke-dasharray="8,4" marker-end="url(#arrowblue)" stroke-linecap="round"/>
  
  <!-- Closing text -->
  <text x="500" y="550" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#666666" text-anchor="middle" font-style="italic">Each stage compounds the previous one. The cycle continues until the structure changes.</text>
</svg>