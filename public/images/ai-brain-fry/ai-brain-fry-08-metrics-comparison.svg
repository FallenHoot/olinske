<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="500" fill="#ffffff"/>
  
  <!-- Vertical divider -->
  <line x1="600" y1="30" x2="600" y2="450" stroke="#ddd" stroke-width="2"/>
  
  <!-- LEFT COLUMN: Wrong Metrics -->
  <rect x="50" y="30" width="500" height="420" fill="#fff5f5" rx="8" stroke="#ff6b6b" stroke-width="2"/>
  
  <!-- Left header -->
  <rect x="50" y="30" width="500" height="50" fill="#ff6b6b" rx="8" stroke="none"/>
  <text x="300" y="65" font-family="system-us" font-size="22" font-weight="bold" fill="white" text-anchor="middle">WRONG METRICS</text>
  
  <!-- Wrong metrics list with X marks -->
  <g transform="translate(100, 110)">
    <!-- Item 1 -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#ff6b6b" stroke-width="3"/>
    <line x1="-8" y1="-8" x2="8" y2="8" stroke="#ff6b6b" stroke-width="3"/>
    <line x1="-8" y1="8" x2="8" y2="-8" stroke="#ff6b6b" stroke-width="3"/>
    <text x="50" y="8" font-family="system-us" font-size="16" fill="#1a1a1a">Lines of Code</text>
    <text x="50" y="30" font-family="system-us" font-size="12" fill="#999">Generated by AI</text>
    
    <!-- Item 2 -->
    <circle cx="0" cy="70" r="20" fill="none" stroke="#ff6b6b" stroke-width="3"/>
    <line x1="-8" y1="62" x2="8" y2="78" stroke="#ff6b6b" stroke-width="3"/>
    <line x1="-8" y1="78" x2="8" y2="62" stroke="#ff6b6b" stroke-width="3"/>
    <text x="50" y="78" font-family="system-us" font-size="16" fill="#1a1a1a">Tools Deployed</text>
    <text x="50" y="100" font-family="system-us" font-size="12" fill="#999">Per employee</text>
    
    <!-- Item 3 -->
    <circle cx="0" cy="140" r="20" fill="none" stroke="#ff6b6b" stroke-width="3"/>
    <line x1="-8" y1="132" x2="8" y2="148" stroke="#ff6b6b" stroke-width="3"/>
    <line x1="-8" y1="148" x2="8" y2="132" stroke="#ff6b6b" stroke-width="3"/>
    <text x="50" y="148" font-family="system-us" font-size="16" fill="#1a1a1a">Adoption Rate</text>
    <text x="50" y="170" font-family="system-us" font-size="12" fill="#999">% of workers using</text>
    
    <!-- Item 4 -->
    <circle cx="0" cy="210" r="20" fill="none" stroke="#ff6b6b" stroke-width="3"/>
    <line x1="-8" y1="202" x2="8" y2="218" stroke="#ff6b6b" stroke-width="3"/>
    <line x1="-8" y1="218" x2="8" y2="202" stroke="#ff6b6b" stroke-width="3"/>
    <text x="50" y="218" font-family="system-us" font-size="16" fill="#1a1a1a">Tokens Consumed</text>
    <text x="50" y="240" font-family="system-us" font-size="12" fill="#999">API usage metrics</text>
  </g>
  
  <!-- RIGHT COLUMN: Right Metrics -->
  <rect x="650" y="30" width="500" height="420" fill="#f0f7ff" rx="8" stroke="#464feb" stroke-width="2"/>
  
  <!-- Right header -->
  <rect x="650" y="30" width="500" height="50" fill="#464feb" rx="8" stroke="none"/>
  <text x="900" y="65" font-family="system-us" font-size="22" font-weight="bold" fill="white" text-anchor="middle">RIGHT METRICS</text>
  
  <!-- Right metrics list with checkmarks -->
  <g transform="translate(700, 110)">
    <!-- Item 1 -->
    <circle cx="0" cy="0" r="20" fill="#464feb" opacity="0.2"/>
    <polyline points="-10,5 0,15 15,-5" fill="none" stroke="#464feb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="8" font-family="system-us" font-size="16" fill="#1a1a1a" font-weight="bold">Business Outcomes</text>
    <text x="50" y="30" font-family="system-us" font-size="12" fill="#999">Revenue, user engagement</text>
    
    <!-- Item 2 -->
    <circle cx="0" cy="80" r="20" fill="#464feb" opacity="0.2"/>
    <polyline points="-10,85 0,95 15,75" fill="none" stroke="#464feb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="88" font-family="system-us" font-size="16" fill="#1a1a1a" font-weight="bold">Quality Metrics</text>
    <text x="50" y="110" font-family="system-us" font-size="12" fill="#999">Bugs, errors, security</text>
    
    <!-- Item 3 -->
    <circle cx="0" cy="160" r="20" fill="#464feb" opacity="0.2"/>
    <polyline points="-10,165 0,175 15,155" fill="none" stroke="#464feb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="168" font-family="system-us" font-size="16" fill="#1a1a1a" font-weight="bold">Team Health</text>
    <text x="50" y="190" font-family="system-us" font-size="12" fill="#999">Engagement, retention, focus</text>
  </g>
  
  <!-- Bottom insight -->
  <rect x="50" y="460" width="1100" height="30" fill="#f0f0f0" rx="4"/>
  <text x="600" y="480" font-family="system-us" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Metrics incentivize behavior. Wrong metrics incentivize brain fry. Right metrics incentivize impact.</text>
</svg>