<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Data center cooling water loop</title>
  <desc id="desc">An original schematic showing a recirculating facility loop connected to a cooling tower, with evaporation, makeup water, and blowdown as separate water pathways.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#087ea4" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e56b2f" />
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#66727d" />
    </marker>
    <style>
      .title { font: 700 30px Georgia, serif; fill: #17324d; }
      .label { font: 600 18px Arial, sans-serif; fill: #17324d; }
      .small { font: 15px Arial, sans-serif; fill: #425466; }
      .box { fill: #f7fbfc; stroke: #9bc8d6; stroke-width: 2; }
      .tower { fill: #dff2f5; stroke: #087ea4; stroke-width: 3; }
      .heat { fill: #fff0e8; stroke: #e56b2f; stroke-width: 3; }
      .loop { fill: none; stroke: #087ea4; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
      .warm { fill: none; stroke: #e56b2f; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-orange); }
      .support { fill: none; stroke: #66727d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-gray); }
      .dash { fill: none; stroke: #e56b2f; stroke-width: 4; stroke-dasharray: 10 8; marker-end: url(#arrow-orange); }
    </style>
  </defs>

  <rect width="1200" height="680" fill="#ffffff" />
  <text x="60" y="62" class="title">Data center cooling: the loop and the losses</text>
  <text x="60" y="94" class="small">The coolant can recirculate while evaporation, makeup water, and blowdown remain separate pathways.</text>

  <rect x="65" y="170" width="245" height="190" rx="14" class="box" />
  <text x="188" y="220" text-anchor="middle" class="label">IT equipment</text>
  <text x="188" y="251" text-anchor="middle" class="small">Servers turn electricity</text>
  <text x="188" y="275" text-anchor="middle" class="small">into heat.</text>
  <rect x="125" y="302" width="126" height="28" rx="5" fill="#17324d" />
  <circle cx="145" cy="316" r="6" fill="#62c1d1" />
  <circle cx="166" cy="316" r="6" fill="#62c1d1" />
  <circle cx="187" cy="316" r="6" fill="#62c1d1" />
  <circle cx="208" cy="316" r="6" fill="#62c1d1" />
  <circle cx="229" cy="316" r="6" fill="#62c1d1" />

  <rect x="440" y="140" width="270" height="250" rx="14" class="heat" />
  <text x="575" y="190" text-anchor="middle" class="label">Heat exchanger / CDU</text>
  <text x="575" y="221" text-anchor="middle" class="small">Separates the IT loop</text>
  <text x="575" y="245" text-anchor="middle" class="small">from the facility loop.</text>
  <rect x="485" y="275" width="180" height="55" rx="8" fill="#ffffff" stroke="#e56b2f" stroke-width="3" />
  <path d="M500 292 H645 M500 309 H645" stroke="#e56b2f" stroke-width="6" />
  <text x="575" y="365" text-anchor="middle" class="small">Water or coolant circulates</text>

  <path d="M310 245 H420 V285 H440" class="warm" />
  <text x="345" y="226" class="small">Warm loop</text>
  <path d="M440 350 H420 V430 H310 V330" class="loop" />
  <text x="333" y="456" class="small">Cooled loop</text>

  <rect x="850" y="145" width="270" height="285" rx="14" class="tower" />
  <path d="M910 205 H1060 L1030 385 H940 Z" fill="#ffffff" stroke="#087ea4" stroke-width="3" />
  <path d="M934 205 H1036" stroke="#087ea4" stroke-width="9" />
  <path d="M950 230 V350 M980 230 V350 M1010 230 V350" stroke="#75c5d2" stroke-width="5" />
  <path d="M910 385 H1060" stroke="#087ea4" stroke-width="9" />
  <path d="M960 178 Q985 150 1010 178" fill="none" stroke="#66727d" stroke-width="5" />
  <text x="985" y="410" text-anchor="middle" class="label">Cooling tower</text>
  <text x="985" y="450" text-anchor="middle" class="small">Heat leaves through air</text>
  <text x="985" y="474" text-anchor="middle" class="small">and, in this design, evaporation.</text>

  <path d="M710 285 H820 V285 H850" class="warm" />
  <text x="735" y="265" class="small">Warm facility water</text>
  <path d="M850 350 H820 V510 H710 V350" class="loop" />
  <text x="730" y="535" class="small">Cooled facility water</text>

  <path d="M985 145 V92" class="dash" />
  <text x="1008" y="92" class="label">Evaporation</text>
  <text x="1008" y="116" class="small">Direct onsite consumption</text>

  <path d="M1060 385 V530 H1110" class="support" />
  <text x="930" y="565" class="label">Blowdown</text>
  <text x="930" y="588" class="small">Concentrated water to treatment</text>

  <path d="M850 510 H790 V610 H700" class="support" />
  <text x="480" y="622" class="label">Makeup water</text>
  <text x="480" y="646" class="small">Replaces evaporation, blowdown, or treatment losses</text>

  <rect x="65" y="520" width="320" height="92" rx="12" fill="#f3f6f8" stroke="#c5d0d8" stroke-width="2" />
  <text x="225" y="554" text-anchor="middle" class="label">Accounting boundary</text>
  <text x="225" y="580" text-anchor="middle" class="small">Recirculating flow is not the same</text>
  <text x="225" y="601" text-anchor="middle" class="small">as water consumed.</text>
</svg>
